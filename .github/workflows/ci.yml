name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # while the extension API is unstable, the tests run the extension in the window
  # of the app, which is a development dependency (see pyproject.toml)
  APP_REF: main
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    working-directory: ext

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ext

      - uses: actions/checkout@v7
        with:
          repository: dcotecnologia/kubescope
          ref: ${{ env.APP_REF }}
          path: kubescope

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: ext/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('ext/.pre-commit-config.yaml') }}

      # ruff, ruff format, docformatter, pyright and the checks of the files
      - name: Pre-commit
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure


  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ext

      - uses: actions/checkout@v7
        with:
          repository: dcotecnologia/kubescope
          ref: ${{ env.APP_REF }}
          path: kubescope

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: ext/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests, which also check the coverage
        run: uv run pytest -q

      - name: Keep the coverage report for the badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ext/coverage.xml
          if-no-files-found: error

  coverage-badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Publish the badge data on the badges branch
        run: |
          percent=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"{rate * 100:.0f}" if rate in (0, 1) else f"{rate * 100:.1f}")
          PY
          )
          color=red
          if awk "BEGIN { exit !($percent >= 100) }"; then color=brightgreen
          elif awk "BEGIN { exit !($percent >= 90) }"; then color=green
          elif awk "BEGIN { exit !($percent >= 75) }"; then color=yellow
          fi
          mkdir badges && cd badges
          git init -q
          git checkout -q -b badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$percent" "$color" > coverage.json
          git add coverage.json
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -q -m "chore(badges): coverage ${percent}%"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
